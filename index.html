<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Zenoti Photo Manager</title>
</head>

<body>
  <header>
    <div class="container">
      <h1>Zenoti Photo Manager</h1>
      <p class="subtitle">Manage your photos with ease</p>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- Upload Section -->
      <section class="upload-section">
        <div class="upload-area" id="uploadArea">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <h3>Upload Photos</h3>
          <p>Drag and drop photos here or click to browse</p>
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
          <button class="btn btn-primary" id="uploadBtn">Select Photos</button>
        </div>
      </section>

      <!-- Filters Section -->
      <section class="filters-section">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All Photos</button>
          <button class="filter-btn" data-filter="recent">Recent</button>
          <button class="filter-btn" data-filter="favorites">Favorites</button>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search photos...">
        </div>
      </section>

      <!-- Stats Section -->
      <section class="stats-section">
        <div class="stat-card">
          <div class="stat-number" id="totalPhotos">0</div>
          <div class="stat-label">Total Photos</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="recentPhotos">0</div>
          <div class="stat-label">Recent (7 days)</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="favoritePhotos">0</div>
          <div class="stat-label">Favorites</div>
        </div>
      </section>

      <!-- Photo Gallery -->
      <section class="gallery-section">
        <div class="gallery-header">
          <h2>Photo Gallery</h2>
          <div class="view-options">
            <button class="view-btn active" data-view="grid">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
              </svg>
            </button>
            <button class="view-btn" data-view="list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="gallery" id="photoGallery">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <h3>No photos yet</h3>
            <p>Upload your first photo to get started</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Photo Modal -->
  <div class="modal" id="photoModal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <img class="modal-image" id="modalImage" src="" alt="">
      <div class="modal-info">
        <h3 id="modalTitle">Photo Title</h3>
        <p id="modalDate">Date</p>
        <div class="modal-actions">
          <button class="btn btn-favorite" id="favoriteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            Add to Favorites
          </button>
          <button class="btn btn-danger" id="deleteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
